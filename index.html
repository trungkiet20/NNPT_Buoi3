<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    tr.hover-row { cursor: pointer; }
    .table-responsive { max-height: 60vh; overflow: auto; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Products Dashboard</h3>
      <div>
        <button id="btnExport" class="btn btn-outline-success btn-sm me-2">Export CSV</button>
        <button id="btnCreate" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal">Tạo mới</button>
      </div>
    </div>

    <div class="row mb-2 g-2">
      <div class="col-md-5">
        <input id="searchInput" class="form-control" placeholder="Tìm kiếm theo title..." />
      </div>
      <div class="col-md-3">
        <select id="pageSizeSelect" class="form-select">
          <option value="5">5 / trang</option>
          <option value="10" selected>10 / trang</option>
          <option value="20">20 / trang</option>
        </select>
      </div>
      <div class="col-md-4 text-end">
        <small id="stats" class="text-muted"></small>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover table-bordered align-middle" id="productsTable">
        <thead class="table-light">
          <tr>
            <th style="width:60px">#</th>
            <th>Title <button id="sortTitle" class="btn btn-sm btn-link">Sắp xếp</button></th>
            <th>Price <button id="sortPrice" class="btn btn-sm btn-link">Sắp xếp</button></th>
            <th>Category</th>
            <th>Images</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <nav>
      <ul class="pagination" id="pagination"></ul>
    </nav>

  </div>

  <!-- View/Edit Modal -->
  <div class="modal fade" id="viewModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Product detail</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input class="form-control" id="editTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Price</label>
              <input type="number" class="form-control" id="editPrice" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="editDescription" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select id="editCategory" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Images (comma separated URLs)</label>
              <input class="form-control" id="editImages">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button id="btnSave" type="button" class="btn btn-primary">Lưu thay đổi</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Modal -->
  <div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Tạo sản phẩm mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="createForm">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input class="form-control" id="createTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Price</label>
              <input type="number" class="form-control" id="createPrice" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="createDescription"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select id="createCategory" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Images (comma separated URLs)</label>
              <input class="form-control" id="createImages">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button id="btnCreateSubmit" type="button" class="btn btn-success">Tạo</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
