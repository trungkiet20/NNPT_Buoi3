<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card-thumb { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
    .card-item { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
    .card-item:hover { transform: translateY(-4px); box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
    .grid-container { min-height: 40vh; }
    @media (max-width: 576px) { .card-thumb { height: 140px; } }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Products Dashboard</h3>
      <div>
        <button id="btnExport" class="btn btn-outline-success btn-sm me-2">Export CSV</button>
        <button id="btnCreate" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal">Tạo mới</button>
      </div>
    </div>

    <div class="row mb-2 g-2">
      <div class="col-md-5">
        <input id="searchInput" class="form-control" placeholder="Tìm kiếm theo title..." />
      </div>
      <div class="col-md-3">
        <select id="pageSizeSelect" class="form-select">
          <option value="5">5 / trang</option>
          <option value="10" selected>10 / trang</option>
          <option value="20">20 / trang</option>
        </select>
      </div>
      <div class="col-md-4 text-end">
        <div class="btn-group me-2" role="group">
          <button id="sortTitle" class="btn btn-outline-secondary btn-sm">Sắp xếp Title</button>
          <button id="sortPrice" class="btn btn-outline-secondary btn-sm">Sắp xếp Price</button>
        </div>
        <small id="stats" class="text-muted d-block"></small>
      </div>
    </div>

    <div class="grid-container mb-3">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3" id="gridBody"></div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <small id="stats" class="text-muted"></small>
      <ul class="pagination mb-0" id="pagination"></ul>
    </div>

  </div>

  <!-- View/Edit Modal -->
  <div class="modal fade" id="viewModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Product detail</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input class="form-control" id="editTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Price</label>
              <input type="number" class="form-control" id="editPrice" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="editDescription" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select id="editCategory" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Images (comma separated URLs)</label>
              <input class="form-control" id="editImages">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button id="btnSave" type="button" class="btn btn-primary">Lưu thay đổi</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Modal -->
  <div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Tạo sản phẩm mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="createForm">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input class="form-control" id="createTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Price</label>
              <input type="number" class="form-control" id="createPrice" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="createDescription"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select id="createCategory" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Images (comma separated URLs)</label>
              <input class="form-control" id="createImages">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button id="btnCreateSubmit" type="button" class="btn btn-success">Tạo</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
